# RoboMaster C 板 STM32F407IGH6，DAPLink / CMSIS-DAP，SWD。
# 沿用旧项目的探针接口；目标及下载工作区由 F4 官方脚本提供。
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f4x.cfg]

# 初次上板沿用旧项目的低速 480 kHz，复位前后保持一致。
# 覆盖 F4 默认的 2/8 MHz 调速事件；下载时保持复位后的 HSI 时钟，
# 正常运行后由固件 SystemClock_Config 配置 168 MHz。
adapter speed 480
[target current] configure -event reset-start { adapter speed 480 }
[target current] configure -event reset-init { adapter speed 480 }

# 普通 SWD 接线不依赖 NRST，使用 Cortex-M 软件系统复位。
reset_config none connect_deassert_srst
cortex_m reset_config sysresetreq
