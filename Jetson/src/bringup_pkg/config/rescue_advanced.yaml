# 高级配置：保留机制、调试和算法参数；由 rescue.yaml 引用，不单独作为启动入口。
# 未启用功能的参数仍保留以支持相应模式；这里不覆盖基础文件中已有的字段。
# 全链路共享类别身份；原图尺寸在基础配置中定义。
shared:
  # 顺序固定为 0 绿、1 亮蓝、2 黑、3 橙。改编号必须同时改 vision_pkg/models/classes.txt。
  # 视觉包已冻结，未授权不要改标签文件。只改这里，ROI 和选择会对不上模型输出。
  classes:
    green: 0
    blue: 1
    black: 2
    orange: 3
  # 模型数字类别候选：包含绿色、排除蓝色；首趟类别由共享 green 编号派生。
  candidate_ids: [0, 2, 3]
# YOLO 与 Field 共用相机和最新帧邮箱；处理慢时取下一张最新帧，不积压旧输入。
# 两阶段按 active_task 切换，不同时推理；JPEG 和 HTTP 保持在推理线程之外。
vision:
  detect:
    # task 决定启动时具备哪些后端，active_task 决定当前执行哪个阶段；both 不表示并行推理。
    task: both
    # -1 使用 GPU；非负值是显式 DLA 核心选择，仍受已有引擎合同约束。
    dla_core: -1
    # 两种输出布局均按同类别IoU去重；用未裁剪框比较，避免画面边缘误合并。
    nms_threshold: 0.7
    max_detections: 300
    publish_masks: false
    # 掩膜尺寸为ceil(源尺寸/scale)；类别编号加offset后饱和到1..255，0保留为背景。
    mask_scale: 2
    mask_label_offset: 1
    max_masks: 32
    publish_field_results: true
    publish_raw: true
    publish_processed: true
    # 各 max_fps 的 0 表示不额外限速，实际速度仍受相机和处理吞吐约束。
    raw_max_fps: 100.0
    # 自动 GStreamer 管线在每次打开相机时设置亮度；-1 为不修改。
    # 150 是当前光照下的临时标定值，其他光照与场地仍需验证。
    camera_brightness: 150
    # 仅 V4L2 后端请求驱动队列深度；GStreamer 不读取此值，其最新帧队列固定为 1。
    camera_buffer_size: 2
    # 留空使用自动管线；非空是开发用完整 GStreamer 管线，须自行保证输出格式及最新帧策略。
    camera_pipeline: ''
    publish_timing: true
    # 两阶段平均上限为 100 FPS，保留最多两帧额度吸收抖动；始终消费最新帧。
    seg_max_fps: 100.0
    field_max_fps: 100.0
    active_task: seg
    publish_status: true
    frame_id: camera
  stream:
    image_topic: /detect_node/image_processed
    seg_detections_topic: /detect_node/seg/detections
    seg_masks_topic: /detect_node/seg/masks
    field_results_topic: /detect_node/field/results
    draw_boxes: true
    draw_labels: true
    # 默认不叠加掩膜；启用时须同时开启 detect.publish_masks。
    draw_masks: false
    draw_field: true
    # 毫秒：等同帧图层的预算从图像到达时计起，且不能超过源帧剩余有效期。
    overlay_wait_ms: 150.0
    input_timeout_s: 1.0
    active_task_topic: /detect_node/active_task
    stream_enabled: true
    stream_max_fps: 100.0
    # 仅缩放 HTTP 图传；ROS 压缩图保留原画布，比例恰为 1 且质量相同才共享 JPEG。
    stream_scale: 1.0
    # 两路 JPEG 共用后端选择；nvjpeg 使用 Jetson 硬件，模型与 JPEG 质量设置不随之变化。
    jpeg_backend: nvjpeg
    publish_annotated: false
    publish_compressed: false
    compressed_quality: 80
    # 默认关闭动态统计叠层；状态/计时话题仍按高级发布开关工作。
    overlay_stats: false
    publish_status: true
    frame_id: ''
  # 场地纯值参数：颜色按 Lab 色相角（度）与相对色度 (|a|+|b|)/L 判定，对曝光与阴影近似不变。
  field:
    # 仅 Field 按 720p 处理；源图/图传仍为 1080p，结果坐标还原到源图。
    proc_width: 1280
    proc_height: 720
    # 鸟瞰像素密度，单位 px/m；bev_width/height 为 0 时按基础配置中的物理尺寸计算。
    bev_px_per_m: 400.0
    # 显式 BEV 像素尺寸；0 按内部尺寸（物理尺寸 − 2×wall_thickness_m）× bev_px_per_m 推导。
    bev_width: 0
    bev_height: 0
    # 围边厚度（米，待实测）：BEV/分区/区域改用内沿四边形，0x182 中心随之变化，STM32 SAFETY_X/Y 须重新标定。
    wall_thickness_m: 0.015
    # 紫框 Lab 色相角 atan2(b,a)，度，-180..180，[下限,上限]，宽度 <180，不得与内部扇区重叠。
    # 录屏实测紫框正面 -63..-72、背面 -48..-60；上限 -15 覆盖暖光下偏红。偏蓝物体可能落入，待现场标定。
    purple_hue_range_deg: [-80.0, -15.0]
    # 相对色度 (|a|+|b|)/L 下限（L 0..100），0..4；阴影下比值基本不变。
    purple_chroma_ratio_min: 0.5
    # Lab L 0..100，按[下限,上限]排列。
    purple_L_range: [8.0, 96.0]
    morph_close_ksize: 5
    morph_close_iter: 2
    morph_dilate_ksize: 3
    morph_dilate_iter: 2
    min_area_frac: 0.004
    # 无量纲矩形比例，按[下限,上限]排列。
    min_rect_ratio_range: [1.2, 12.0]
    max_border_touch: 2
    min_fill_ratio: 0.45
    max_candidates_try: 4
    corner_exclude_frac: 0.06
    edge_bins: 32
    edge_band_frac: 0.18
    fit_outlier_px: 2.0
    fit_iterations: 4
    min_side_points: 8
    min_side_inliers: 6
    prior_corner_tol_frac: 0.12
    quad_min_area_frac: 0.004
    # 无量纲边长比例，按[下限,上限]排列。
    quad_side_ratio_range: [0.2, 6.0]
    use_aspect_check: false
    quad_max_aspect_err: 2.0
    # 归一化搜索区间0..1，按[下限,上限]排列，间距至少0.001。
    black_search_range: [0.14, 0.86]
    # 归一化采样行区间0..1，按[下限,上限]排列，间距至少0.001。
    black_row_range: [0.12, 0.88]
    # 黑带色度相对同行两侧内部颜色的下陷深度 1-C/C_side；不看绝对灰度，反光提亮仍可测。
    black_min_depth: 0.35
    black_conf_depth: 0.7
    # 沿线资格行中有黑带支持的比例；三个纵向分段各需达到其一半，支持行首末跨度也须达到内部行的该比例。
    black_score_frac: 0.6
    # 黑带最大宽度/BEV宽度；其一半同时是两侧参照段的偏移与长度。
    black_max_width_frac: 0.06
    # 黑带亮度最多高出两侧较亮参照的比例；更亮的无色窄条视为高光，不作黑带。
    black_max_lift: 0.25
    # 仅标记split_suspect；可靠偏心线仍采用实测，不回退几何中线。
    black_max_offset_frac: 0.04
    bev_border_margin_frac: 0.04
    # 红色内部 Lab 色相扇区，度，[下限,上限]；下限 -12 覆盖冷光，上限 46 把木纹/橙色地面挡在外面。待现场标定。
    red_hue_range_deg: [-12.0, 46.0]
    # 红色内部相对色度下限 (|a|+|b|)/L，0..4。
    red_chroma_ratio_min: 0.6
    red_L_min: 15.0
    use_blue_interior: false
    # 蓝色内部 Lab 色相扇区，度，[下限,上限]；需现场标定。
    blue_hue_range_deg: [-140.0, -80.0]
    # 蓝色内部相对色度下限 (|a|+|b|)/L，0..4。
    blue_chroma_ratio_min: 0.6
    blue_L_min: 12.0
    # 内部颜色掩膜开运算核边长（像素，奇数，1 不做）；去掉紫框与地面混色的一两像素细边。
    interior_open_ksize: 3
    locate_hits_needed: 2
    lost_frames_to_search: 6
    refit_every: 10
    track_window_scale: 1.35
    edge_samples: 40
    edge_probe_radius: 3
    edge_support_min: 0.25
    edge_support_strong: 0.35
    w_purple: 0.3
    w_temporal: 0.3
    w_red_inside: 0.2
    w_red_outside: 0.15
    w_geometry: 0.05
    min_total_score: 0.45
    min_purple_score: 0.28
    red_inside_min: 0.15
    red_outside_max: 0.25
    purple_lost_threshold: 0.15
    red_cells_min: 4
    expand_frac: 0.08
    red_grid_cols: 4
    red_grid_rows: 2
    red_cell_min: 0.1
    pred_velocity_gain: 0.7
    max_jump_frac: 0.35
    jump_accept_frac: 0.35
    switch_confirm_frames: 2
    fast_switch_purple: 0.45
    fast_switch_red_inside: 0.45
    fast_switch_red_outside: 0.12
    max_hold_frames: 5
# 跟踪和选择：max_age按已接受帧计数，不是秒。
tracking:
  track:
    det_threshold: 0.25
    detections_topic: /detect_node/seg/detections
    active_task_topic: /detect_node/active_task
    iou_threshold: 0.3
    inertia: 0.2
    # max_age为未命中容忍帧数，min_hits为连续匹配门槛（含核心预热规则），delta_t为速度回看跨度。
    # 空检测帧也推进跟踪帧龄，三个量均不是秒数。
    max_age: 10
    min_hits: 3
    delta_t: 3
    # 弱检测关联需上游保留低于det_threshold的框；不自动修改检测阈值。
    use_byte: false
    reset_timeout_s: 1.0
  select:
    tracks_topic: /track_node/seg/tracks
    active_task_topic: /detect_node/active_task
    reset_timeout_s: 1.0
    mission_status_topic: /mission_node/status
# 任务：ROI 1秒 < Mission 2秒；源时间和单调截止不可混用。
mission:
  controller:
    # 单调秒；外层超时必须大于下游。
    request_timeout_s: 2.0
    detector_service: /detect_node/set_field
    detector_task_topic: /detect_node/active_task
    target_roi_service: /target_node/check_roi
  target:
    # 单调秒；受理后等待首个新鲜完整原始检测。
    roi_check_timeout_s: 1.0
    input_topic: /select_node/target
    control_topic: /mission_node/active_task
    reset_timeout_s: 1.0
    detections_topic: /detect_node/seg/detections
  safety:
    input_topic: /detect_node/field/results
    control_topic: /mission_node/active_task
    reset_timeout_s: 1.0
    mission_status_topic: /mission_node/status
# CAN：输入、发送队列和请求超时分别见高级配置，职责保持独立。0x180 为心跳，无速度话题。
bridge:
  # 输入ROS源帧龄与本机单调到达龄上限；发送前复核，不替代排队寿命。
  input_timeout_s: 0.25
  # 安全区中心保持，单位秒，(0, input_timeout_s]：最近一次有效 field 中心到达后该时长内持续发 0x182，
  # 期间的分区不可靠帧不撤销它，消除逐帧闪烁；源帧龄仍受 input_timeout_s 约束。
  # 入口校验 safety_hold_s + 1/vision.detect.field_max_fps < 0.25 s（STM32 中心接收期限）。
  safety_hold_s: 0.2
  # 发送帧入队后的单调寿命，单位秒；同 ID 合并和背压重试都不续期。
  tx_queue_timeout_s: 0.1
  # 单调秒；外层超时必须大于下游。
  request_timeout_s: 3.0
  # 未见 MissionStatus 的失联门限，单位秒。值与原硬编码 500 ms 相同，入口按 *_timeout_s 校验。
  mission_watchdog_timeout_s: 0.5
  target_topic: /target_node/target
  safety_topic: /safety_node/target
  task_topic: /mission_node/active_task
  mission_status_topic: /mission_node/status
  roi_service: /mission_node/arrived
  command_service: /mission_node/command
# 夹爪控制参数。刚度按现值填写；开合角为相对上电位置的已定默认值。
gripper:
  # 输出位置刚度 / 速度刚度，待实车标定。
  kp: 1.0
  kd: 0.05
  # 相对上电位置的闭合角、张开角（度）。待实车核对（装配姿态需板端验证）。
  closed_deg: -40
  open_deg: 40
  # 自动开或合一次的动作时长（秒）；待实车标定。
  move_s:

