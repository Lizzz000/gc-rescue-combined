<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GC Rescue 手动控制</title>
<style>
  :root {
    --bg: #eef1f5; --card: #fff; --text: #1d2733; --muted: #6b7785; --line: #dde3ea;
    --accent: #1f6feb; --accent-soft: #dbe8fd; --danger: #c62828; --ok: #2e7d32; --warn: #ef6c00;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header .hint { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; max-width: 1180px; margin: 0 auto; }
  @media (min-width: 900px) { main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .column { display: grid; gap: 16px; align-content: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: 0 1px 2px rgba(0, 0, 0, .04); }
  .card h2 { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .slider { display: grid; grid-template-columns: 5.5em 1fr 6.5em; align-items: center; gap: 10px; margin: 6px 0; }
  .slider input { width: 100%; }
  .slider output { font-variant-numeric: tabular-nums; text-align: right; }
  .pad { display: grid; grid-template-columns: repeat(3, 88px); grid-template-rows: repeat(3, 72px);
    gap: 10px; justify-content: center; margin: 18px 0; }
  .pad button { border: 1px solid var(--line); border-radius: 10px; background: #f7f9fb; color: var(--text);
    font-size: 24px; touch-action: none; user-select: none; cursor: pointer; transition: background .08s, transform .08s; }
  .pad button small { display: block; color: var(--muted); font-size: 11px; }
  .pad button.active { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(.97); }
  .pad button.active small { color: #dbe8fd; }
  .pad .center { background: #fdecea; border-color: #f5c2bd; color: var(--danger); font-weight: 600; }
  .pad .blank { visibility: hidden; }
  .stop { width: 100%; height: 56px; border: 0; border-radius: 10px; background: var(--danger); color: #fff;
    font-size: 17px; font-weight: 600; cursor: pointer; }
  .stop:active { filter: brightness(.9); }
  .gap-top { margin-top: 8px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: #eceff3; color: var(--muted); }
  .badge.idle { background: #eceff3; color: var(--muted); }
  .badge.prepare { background: #fff3e0; color: var(--warn); }
  .badge.active { background: #e8f5e9; color: var(--ok); }
  .badge.stopping { background: #fdecea; color: var(--danger); }
  .badge.offline { background: var(--danger); color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 17px; font-variant-numeric: tabular-nums; word-break: break-all; }
  .stat .value.small { font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .timed { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .timed label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
  .timed input { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px;
    font-variant-numeric: tabular-nums; }
  .submit { margin-top: 12px; width: 100%; height: 42px; border: 0; border-radius: 8px; background: var(--accent);
    color: #fff; font-size: 15px; cursor: pointer; }
  .error { color: var(--danger); min-height: 1.5em; margin-top: 8px; font-size: 13px; }
  .keys { color: var(--muted); font-size: 13px; margin: 0; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
    background: #f7f9fb; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>GC Rescue 手动控制 <span class="hint">0x17F</span></h1>
  <span class="hint">按住运动、松开即停；<kbd>空格</kbd> 急停；页面失焦或切走自动停车</span>
</header>
<main>
  <section class="card">
    <h2>运动控制</h2>
    <div class="slider"><span>平移速度</span><input id="linear" type="range" min="0.02" step="0.01" value="0.1"><output id="linear_v"></output></div>
    <div class="slider"><span>转向速度</span><input id="angular" type="range" min="0.1" step="0.05" value="0.5"><output id="angular_v"></output></div>
    <div class="pad">
      <button data-move="ccw">⟲<small>Q 左转</small></button>
      <button data-move="forward">↑<small>W 前进</small></button>
      <button data-move="cw">⟳<small>E 右转</small></button>
      <button data-move="left">←<small>A 左移</small></button>
      <button class="center" id="pad_stop">■<small>停车</small></button>
      <button data-move="right">→<small>D 右移</small></button>
      <button class="blank" tabindex="-1" aria-hidden="true"></button>
      <button data-move="backward">↓<small>S 后退</small></button>
      <button class="blank" tabindex="-1" aria-hidden="true"></button>
    </div>
    <button class="stop" id="stop">停车（空格）</button>
    <p class="keys">键盘：<kbd>W</kbd>/<kbd>S</kbd> 或 <kbd>↑</kbd>/<kbd>↓</kbd> 前后，<kbd>A</kbd>/<kbd>D</kbd> 或 <kbd>←</kbd>/<kbd>→</kbd> 平移，<kbd>Q</kbd>/<kbd>E</kbd> 转向。</p>
    <div id="error" class="error"></div>
  </section>
  <div class="column">
    <section class="card">
      <div class="row"><h2 style="margin:0">实时状态</h2><span id="phase" class="badge offline">连接中</span></div>
      <div class="stats">
        <div class="stat"><div class="label">指令 vx / vy（m/s）</div><div class="value" id="cmd_linear">–</div></div>
        <div class="stat"><div class="label">指令 wz（rad/s）</div><div class="value" id="cmd_angular">–</div></div>
        <div class="stat"><div class="label">剩余时间（s）</div><div class="value" id="remaining">–</div></div>
        <div class="stat"><div class="label">最近一帧 0x17F</div><div class="value" id="last_frame">–</div></div>
        <div class="stat"><div class="label">已发帧数</div><div class="value" id="frames">–</div></div>
        <div class="stat"><div class="label">发送频率（Hz）</div><div class="value" id="rate">–</div></div>
        <div class="stat"><div class="label">设备</div><div class="value small" id="device">–</div></div>
        <div class="stat"><div class="label">限幅</div><div class="value" id="limits">–</div></div>
      </div>
    </section>
    <section class="card">
      <h2>定时动作</h2>
      <div class="timed">
        <label>vx（m/s）<input id="t_vx" type="number" step="0.01" value="0.08"></label>
        <label>vy（m/s）<input id="t_vy" type="number" step="0.01" value="0"></label>
        <label>wz（rad/s）<input id="t_wz" type="number" step="0.05" value="0"></label>
        <label>时长（s）<input id="t_s" type="number" step="0.1" value="1.2"></label>
      </div>
      <button class="submit" id="timed">执行</button>
      <div id="timed_error" class="error"></div>
    </section>
    <section class="card">
      <h2>舵机转角</h2>
      <p class="keys">相对当前输出端角度转动，到时停机。张开/闭合走已标定的上电零点目标角。不走 CAN，也不参与自动搬运。底盘停车不会打断舵机。</p>
      <div class="timed">
        <label>角度（°）<input id="servo_deg" type="number" step="1" value="30"></label>
        <label>时长（s）<input id="servo_s" type="number" step="0.1" value="2"></label>
      </div>
      <button class="submit" id="servo_move">转动</button>
      <button class="submit gap-top" id="servo_open">张开</button>
      <button class="submit gap-top" id="servo_close">闭合</button>
      <button class="stop gap-top" id="servo_stop">舵机停机</button>
      <div id="servo_error" class="error"></div>
      <div class="stats gap-top">
        <div class="stat"><div class="label">舵机</div><div class="value small" id="servo_state">–</div></div>
        <div class="stat"><div class="label">反馈位置（°）</div><div class="value" id="servo_pos">–</div></div>
      </div>
    </section>
  </div>
</main>
<script>
// 方向单位向量：vx 前进，vy 左移，wz 逆时针。
const MOVES = {
  forward: [1, 0, 0], backward: [-1, 0, 0], left: [0, 1, 0], right: [0, -1, 0],
  ccw: [0, 0, 1], cw: [0, 0, -1],
};
const KEYS = {
  ArrowUp: 'forward', KeyW: 'forward', ArrowDown: 'backward', KeyS: 'backward',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyQ: 'ccw', KeyE: 'cw',
};
const PHASES = {idle: '空闲', prepare: '使能零速', active: '运动中', stopping: '停车零速'};
// 按住期间每 50 ms 续租；服务端租约 ≤ 200 ms，漏发几次即自动停车。
const RENEW_MS = 50;
const POLL_MS = 250;
const held = new Set();
let timer = null;

const $ = (id) => document.getElementById(id);
for (const id of ['linear', 'angular']) {
  const show = () => { $(id + '_v').textContent = $(id).value + (id === 'linear' ? ' m/s' : ' rad/s'); };
  $(id).addEventListener('input', show);
  show();
}

// 按钮高亮只反映 held 集合，鼠标、触摸与键盘同一来源。
function highlight() {
  for (const button of document.querySelectorAll('[data-move]')) {
    button.classList.toggle('active', held.has(button.dataset.move));
  }
}

async function postJson(path, body, errorId) {
  try {
    const response = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body || {})});
    const data = await response.json();
    $(errorId).textContent = response.ok ? '' : data.error;
    if (response.ok) { show(data); }
  } catch (error) {
    $(errorId).textContent = '连接失败：' + error;
  }
}

function post(path, body) {
  return postJson(path, body, 'error');
}

function velocity() {
  const linear = Number($('linear').value), angular = Number($('angular').value);
  const sum = [0, 0, 0];
  for (const move of held) { MOVES[move].forEach((value, i) => { sum[i] += value; }); }
  return {vx: sum[0] * linear, vy: sum[1] * linear, wz: sum[2] * angular};
}

function renew() {
  if (held.size === 0) { return; }
  post('/api/hold', velocity());
}

function press(move) {
  if (held.has(move)) { return; }
  held.add(move);
  highlight();
  renew();
  if (timer === null) { timer = setInterval(renew, RENEW_MS); }
}

function release(move) {
  held.delete(move);
  highlight();
  if (held.size === 0) { stop(); } else { renew(); }
}

function stop() {
  held.clear();
  highlight();
  if (timer !== null) { clearInterval(timer); timer = null; }
  post('/api/stop');
}

for (const button of document.querySelectorAll('[data-move]')) {
  const move = button.dataset.move;
  button.addEventListener('pointerdown', (event) => { button.setPointerCapture(event.pointerId); press(move); });
  for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    button.addEventListener(name, () => release(move));
  }
}
document.addEventListener('keydown', (event) => {
  if (event.target.tagName === 'INPUT') { return; }
  if (event.code === 'Space') { event.preventDefault(); stop(); return; }
  const move = KEYS[event.code];
  if (move) { event.preventDefault(); press(move); }
});
document.addEventListener('keyup', (event) => {
  const move = KEYS[event.code];
  if (move) { release(move); }
});
window.addEventListener('blur', stop);
document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); } });
$('stop').addEventListener('click', stop);
$('pad_stop').addEventListener('click', stop);
// 限幅来自 /api/state；未取得前拒绝定时提交。
let limits = null;
$('timed').addEventListener('click', () => {
  const body = {vx: Number($('t_vx').value), vy: Number($('t_vy').value), wz: Number($('t_wz').value),
    seconds: Number($('t_s').value)};
  const problems = [];
  if (limits === null) { problems.push('尚未取得限幅'); } else {
    if (Math.hypot(body.vx, body.vy) > limits.linear_mps) { problems.push(`平移合速度 ≤ ${limits.linear_mps} m/s`); }
    if (Math.abs(body.wz) > limits.angular_radps) { problems.push(`|wz| ≤ ${limits.angular_radps} rad/s`); }
  }
  if (!Object.values(body).every(Number.isFinite)) { problems.push('请输入有效数字'); }
  $('timed_error').textContent = problems.join('；');
  if (problems.length === 0) { post('/api/timed', body); }
});

function postServo(path, body) {
  return postJson(path, body, 'servo_error');
}
$('servo_move').addEventListener('click', () => {
  postServo('/api/servo', {degrees: Number($('servo_deg').value), seconds: Number($('servo_s').value)});
});
$('servo_open').addEventListener('click', () => {
  postServo('/api/servo/open', {seconds: Number($('servo_s').value)});
});
$('servo_close').addEventListener('click', () => {
  postServo('/api/servo/close', {seconds: Number($('servo_s').value)});
});
$('servo_stop').addEventListener('click', () => { postServo('/api/servo/stop'); });

// 发送频率由相邻两次轮询的帧数差估算（POST 回包不参与，避免间隔过短）。
let lastCount = null;
const fixed = (value, digits) => Number(value).toFixed(digits);
function show(state) {
  if (state.limits && limits === null) {
    limits = state.limits;
    $('linear').max = limits.linear_mps;
    $('angular').max = limits.angular_radps;
    $('limits').textContent = `${limits.linear_mps} m/s · ${limits.angular_radps} rad/s`;
  }
  const phase = $('phase');
  phase.className = 'badge ' + state.phase;
  phase.textContent = PHASES[state.phase] || state.phase;
  const [vx, vy, wz] = state.velocity_milli.map((value) => value / 1000);
  $('cmd_linear').textContent = `${fixed(vx, 3)} / ${fixed(vy, 3)}`;
  $('cmd_angular').textContent = fixed(wz, 3);
  $('remaining').textContent = fixed(state.remaining_s, 2);
  const [valid, fx, fy, fw] = state.last_frame;
  $('last_frame').textContent = `valid=${valid ? 1 : 0}  ${fx} ${fy} ${fw}`;
  $('frames').textContent = state.frames;
  $('device').textContent = state.device;
  if (state.servo) {
    let servoText = '未连接';
    if (state.servo.busy) {
      servoText = '转动中';
    } else if (state.servo.message) {
      servoText = state.servo.message;
    } else if (state.servo.available) {
      servoText = '就绪';
    }
    $('servo_state').textContent = servoText;
    $('servo_pos').textContent = state.servo.position_deg === null || state.servo.position_deg === undefined
      ? '–' : fixed(state.servo.position_deg, 2);
  }
}
function rate(state) {
  const now = performance.now();
  if (lastCount !== null && now > lastCount.at) {
    $('rate').textContent = fixed((state.frames - lastCount.frames) * 1000 / (now - lastCount.at), 0);
  }
  lastCount = {frames: state.frames, at: now};
}
setInterval(async () => {
  try {
    const state = await (await fetch('/api/state')).json();
    show(state);
    rate(state);
  } catch (error) {
    $('phase').className = 'badge offline';
    $('phase').textContent = '断开';
    lastCount = null;
  }
}, POLL_MS);
</script>
</body>
</html>
